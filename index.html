<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <title>JİBER Saha Denetim ve Kalite Portalı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="brand-mark big">JİBER</div>
    <div class="spinner"></div>
    <p class="muted">Portal yükleniyor…</p>
  </div>

  <!-- Giriş / şifre sıfırlama ekranları -->
  <main id="auth" class="auth" hidden></main>

  <!-- Uygulama -->
  <div id="shell" hidden>
    <header class="topbar">
      <a href="#/ana" class="brand"><span class="brand-mark">JİBER</span><span class="brand-sub">Saha Denetim &amp; Kalite</span></a>
      <div class="topbar-right">
        <div class="clock" title="Sunucu saati"><span data-clock></span><small data-clock-src></small></div>
        <button class="user-btn" data-act="user-menu" aria-label="Kullanıcı menüsü">
          <span class="avatar" id="avatar"></span>
          <span class="user-meta"><b id="userName"></b><small id="userRole"></small></span>
        </button>
      </div>
    </header>
    <nav class="nav" id="nav">
      <a href="#/ana" data-nav="ana"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Ana Sayfa</span></a>
      <a href="#/denetim" data-nav="denetim"><svg viewBox="0 0 24 24"><path d="M9 4h6v2H9zM6 5h2v2h8V5h2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm3.5 9.6l-1.4 1.4L11 19l5-5-1.4-1.4L11 16.2z"/></svg><span>Denetim</span></a>
      <a href="#/raporlar" data-nav="raporlar"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 8v2h10v-2zm0 4v2h7v-2zm0-8v2h6V7z"/></svg><span>Raporlar</span></a>
      <a href="#/yonetim" data-nav="yonetim" data-admin-only><svg viewBox="0 0 24 24"><path d="M4 6h9.2a3 3 0 0 1 5.6 0H20v2h-1.2a3 3 0 0 1-5.6 0H4zm12 2a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM4 16h3.2a3 3 0 0 1 5.6 0H20v2h-7.2a3 3 0 0 1-5.6 0H4zm6 2a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg><span>Yönetim</span></a>
    </nav>
    <main id="view" class="view"></main>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
